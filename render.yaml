databases:
  - name: magnificat-db
    databaseName: gestion_scolaire
    user: magnificat_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: gestion-scolaire-magnificat
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: bash build.sh
    startCommand: cd gestion_scolaire && gunicorn config.wsgi --log-file -
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: magnificat-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: PLATFORM_URL
        value: "https://gestion-scolaire-magnificat.onrender.com/app/"
      - key: EMAIL_HOST_USER
        value: "komlanagouvi77@gmail.com"
      - key: DEFAULT_FROM_EMAIL
        value: "Complexe Scolaire Magnificat <komlanagouvi77@gmail.com>"
      - fromGroup: magnificat-secrets
