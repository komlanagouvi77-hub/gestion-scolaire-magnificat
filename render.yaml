databases:
  - name: magnificat-db
    databaseName: gestion_scolaire
    user: magnificat_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: gestion-scolaire-magnificat
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: bash build.sh
    startCommand: cd gestion_scolaire && gunicorn config.wsgi --log-file -
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: magnificat-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
