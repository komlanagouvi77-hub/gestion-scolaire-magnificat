{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo React - Gestion Scolaire Magnificat</title>
    <link href="{% static 'css/magnificat.css' %}" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <style>
.react-shell {
  display: flex;
  min-height: 100vh;
}
.react-sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--indigo-950);
  color: #fff;
  display: flex;
  flex-direction: column;
  padding: 1.2rem 1rem;
  animation: magFadeInDown 0.4s ease-out;
}
.react-sidebar-brand {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 1.8rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}
.react-sidebar-brand .crest {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--gold-500);
  color: var(--indigo-950);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
}
.react-nav-link {
  display: block;
  padding: 0.6rem 0.8rem;
  border-radius: 6px;
  color: rgba(255,255,255,0.75);
  font-size: 0.9rem;
  cursor: pointer;
  margin-bottom: 0.2rem;
  transition: background-color 0.15s ease, color 0.15s ease, padding-left 0.15s ease;
}
.react-nav-link:hover {
  background: rgba(255,255,255,0.08);
  color: #fff;
  padding-left: 1rem;
}
.react-nav-link.actif {
  background: var(--gold-500);
  color: var(--indigo-950);
  font-weight: 600;
}
.react-sidebar-bas {
  margin-top: auto;
  padding-top: 1rem;
  border-top: 1px solid rgba(255,255,255,0.15);
}
.react-user-pill {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.7);
  margin-bottom: 0.7rem;
  text-align: center;
}
.react-contenu {
  flex: 1;
  padding: 2rem;
  animation: magFadeInUp 0.35s ease-out;
}
.react-fade-in {
  animation: magFadeInUp 0.4s ease-out both;
}
.react-alert-erreur {
  background: #F5EBD1;
  border: 1px solid var(--red-600);
  color: var(--red-600);
  padding: 0.7rem 0.9rem;
  font-size: 0.85rem;
  margin-bottom: 1rem;
  border-radius: 6px;
}
.react-barre-animee {
  animation: magBarreMontee 0.6s ease-out both;
}
@keyframes magBarreMontee {
  from { transform: scaleY(0); }
  to   { transform: scaleY(1); }
}

@media (max-width: 820px) {
  .react-shell { flex-direction: column; }
  .react-sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; }
  .react-sidebar-brand { border-bottom: none; margin-bottom: 0; padding-bottom: 0; margin-right: 1rem; }
  .react-sidebar nav { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .react-sidebar-bas { margin-top: 0.6rem; width: 100%; }
  .react-contenu { padding: 1.2rem; }
}

    </style>
</head>
<body>
    <div id="racine-react"></div>

<script>
const { useState, useEffect, useMemo } = React;
const e = React.createElement;

const API_BASE = "/api";

function ConnexionForm({ onConnecte }) {
    const [utilisateur, setUtilisateur] = useState("");
    const [motDePasse, setMotDePasse] = useState("");
    const [erreur, setErreur] = useState("");
    const [enCours, setEnCours] = useState(false);

    const soumettre = async (evt) => {
        evt.preventDefault();
        setErreur("");
        setEnCours(true);
        try {
            const resp = await fetch(`${API_BASE}/token/`, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `username=${encodeURIComponent(utilisateur)}&password=${encodeURIComponent(motDePasse)}`,
            });
            if (!resp.ok) {
                setErreur("Identifiants incorrects.");
                setEnCours(false);
                return;
            }
            const donnees = await resp.json();
            onConnecte(donnees.token, utilisateur);
        } catch (err) {
            setErreur("Erreur de connexion au serveur.");
        }
        setEnCours(false);
    };

    return e("div", { className: "mag-login-wrap", style: { minHeight: "70vh" } },
        e("div", { className: "mag-login-card" },
            e("div", { className: "crest-big" }, "M"),
            e("h1", null, "Demo React"),
            e("div", { className: "sub" }, "Connexion via l'API REST"),
            erreur && e("div", { className: "react-alert-erreur" }, erreur),
            e("form", { onSubmit: soumettre },
                e("div", { className: "mag-field" },
                    e("label", null, "Nom d'utilisateur"),
                    e("input", { type: "text", value: utilisateur, onChange: (ev) => setUtilisateur(ev.target.value), required: true })
                ),
                e("div", { className: "mag-field" },
                    e("label", null, "Mot de passe"),
                    e("input", { type: "password", value: motDePasse, onChange: (ev) => setMotDePasse(ev.target.value), required: true })
                ),
                e("button", { type: "submit", className: "mag-btn-primary", disabled: enCours }, enCours ? "Connexion..." : "Se connecter")
            )
        )
    );
}

function CarteStat({ label, valeur }) {
    return e("div", { className: "mag-card react-fade-in" },
        e("div", { className: "mag-stat-label" }, label),
        e("div", { className: "mag-stat-value" }, valeur)
    );
}

/* Graphique en barres pure SVG (aucune librairie externe) */
function GraphiqueBarres({ titre, donnees }) {
    const maxValeur = Math.max(1, ...donnees.map(d => d.valeur));
    const largeurBarre = 46;
    const espace = 22;
    const hauteur = 160;
    const largeurTotale = donnees.length * (largeurBarre + espace) + espace;

    return e("div", { className: "mag-card react-fade-in" },
        e("div", { className: "mag-stat-label", style: { marginBottom: "0.9rem" } }, titre),
        donnees.length === 0
            ? e("p", { style: { color: "var(--ink-600)" } }, "Pas assez de donnees pour un graphique.")
            : e("svg", { viewBox: `0 0 ${largeurTotale} ${hauteur + 30}`, style: { width: "100%", height: "220px" } },
                donnees.map((d, i) => {
                    const h = (d.valeur / maxValeur) * hauteur;
                    const x = espace + i * (largeurBarre + espace);
                    const y = hauteur - h;
                    return e("g", { key: d.label },
                        e("rect", {
                            x, y, width: largeurBarre, height: h,
                            fill: "#B08A2E", rx: 4,
                            className: "react-barre-animee",
                            style: { transformOrigin: `${x + largeurBarre / 2}px ${hauteur}px` },
                        }),
                        e("text", {
                            x: x + largeurBarre / 2, y: y - 6, textAnchor: "middle",
                            fontSize: "12", fill: "#0A2540", fontWeight: "600",
                        }, d.valeur),
                        e("text", {
                            x: x + largeurBarre / 2, y: hauteur + 18, textAnchor: "middle",
                            fontSize: "10", fill: "#64748B",
                        }, d.label)
                    );
                })
            )
    );
}

function TableauGenerique({ colonnes, lignes, cleLigne }) {
    return e("div", { className: "mag-table-wrap" },
        e("table", { className: "mag-table" },
            e("thead", null, e("tr", null, colonnes.map(c => e("th", { key: c.cle }, c.titre)))),
            e("tbody", null,
                lignes.length === 0
                    ? e("tr", null, e("td", { colSpan: colonnes.length, style: { textAlign: "center", color: "var(--ink-600)" } }, "Aucune donnee."))
                    : lignes.map(ligne => e("tr", { key: ligne[cleLigne] },
                        colonnes.map(c => e("td", { key: c.cle }, c.rendu ? c.rendu(ligne) : (ligne[c.cle] ?? "-")))
                      ))
            )
        )
    );
}

const RESSOURCES = {
    eleves: { url: "eleves", label: "Eleves", colonnes: [
        { cle: "matricule", titre: "Matricule" },
        { cle: "nom", titre: "Nom" },
        { cle: "prenom", titre: "Prenom" },
        { cle: "classe_nom", titre: "Classe" },
    ]},
    classes: { url: "classes", label: "Classes", colonnes: [
        { cle: "nom", titre: "Nom" },
        { cle: "niveau", titre: "Niveau" },
        { cle: "annee_scolaire", titre: "Annee scolaire" },
    ]},
    notes: { url: "notes", label: "Notes", colonnes: [
        { cle: "eleve", titre: "Eleve (ID)" },
        { cle: "matiere", titre: "Matiere (ID)" },
        { cle: "type_evaluation", titre: "Type" },
        { cle: "valeur", titre: "Valeur" },
        { cle: "trimestre", titre: "Trimestre" },
    ]},
    absences: { url: "absences", label: "Absences", colonnes: [
        { cle: "eleve", titre: "Eleve (ID)" },
        { cle: "date", titre: "Date" },
        { cle: "justifiee", titre: "Justifiee", rendu: (l) => l.justifiee ? "Oui" : "Non" },
    ]},
    paiements: { url: "paiements", label: "Paiements", colonnes: [
        { cle: "eleve", titre: "Eleve (ID)" },
        { cle: "montant", titre: "Montant (FCFA)" },
        { cle: "mode_paiement", titre: "Mode" },
        { cle: "date_paiement", titre: "Date" },
    ]},
    annonces: { url: "annonces", label: "Annonces", colonnes: [
        { cle: "titre", titre: "Titre" },
        { cle: "destinataires", titre: "Destinataires" },
        { cle: "date_publication", titre: "Date" },
    ]},
};

function useRessource(nom, token) {
    const [donnees, setDonnees] = useState(null);
    const [statut, setStatut] = useState("chargement");

    useEffect(() => {
        let annule = false;
        setStatut("chargement");
        fetch(`${API_BASE}/${RESSOURCES[nom].url}/`, { headers: { Authorization: `Token ${token}` } })
            .then(r => r.ok ? r.json() : Promise.reject(r.status))
            .then(json => {
                if (annule) return;
                setDonnees(json.results || json);
                setStatut("ok");
            })
            .catch(() => {
                if (annule) return;
                setDonnees([]);
                setStatut("refuse");
            });
        return () => { annule = true; };
    }, [nom, token]);

    return { donnees: donnees || [], statut };
}

function PageTableauDeBord({ token }) {
    const eleves = useRessource("eleves", token);
    const classes = useRessource("classes", token);
    const paiements = useRessource("paiements", token);
    const absences = useRessource("absences", token);

    const repartitionParClasse = useMemo(() => {
        const compteurs = {};
        eleves.donnees.forEach(el => {
            const cle = el.classe_nom || "Sans classe";
            compteurs[cle] = (compteurs[cle] || 0) + 1;
        });
        return Object.entries(compteurs).map(([label, valeur]) => ({ label, valeur }));
    }, [eleves.donnees]);

    return e(React.Fragment, null,
        e("div", { className: "mag-page-title" }, e("span", { className: "eyebrow" }, "React + API REST"), " Tableau de bord"),
        e("div", { className: "mag-grid-4", style: { marginBottom: "1.5rem" } },
            e(CarteStat, { label: "Eleves (visibles)", valeur: eleves.donnees.length }),
            e(CarteStat, { label: "Classes (visibles)", valeur: classes.donnees.length }),
            e(CarteStat, { label: "Absences (visibles)", valeur: absences.donnees.length }),
            e(CarteStat, { label: "Paiements (visibles)", valeur: paiements.donnees.length })
        ),
        e(GraphiqueBarres, { titre: "Repartition des eleves par classe", donnees: repartitionParClasse })
    );
}

function PageRessource({ nom, token }) {
    const { donnees, statut } = useRessource(nom, token);
    const config = RESSOURCES[nom];

    return e(React.Fragment, null,
        e("div", { className: "mag-page-title" }, e("span", { className: "eyebrow" }, "React + API REST"), ` ${config.label}`),
        statut === "chargement" && e("p", null, "Chargement..."),
        statut === "refuse" && e("div", { className: "react-alert-erreur" }, "Acces refuse ou aucune donnee pour ce compte sur cette ressource."),
        statut === "ok" && e("div", { className: "react-fade-in" }, e(TableauGenerique, { colonnes: config.colonnes, lignes: donnees, cleLigne: "id" }))
    );
}

function AppConnectee({ token, utilisateur, onDeconnexion }) {
    const [page, setPage] = useState("dashboard");

    const liensNav = [
        { cle: "dashboard", label: "Tableau de bord" },
        { cle: "eleves", label: "Eleves" },
        { cle: "classes", label: "Classes" },
        { cle: "notes", label: "Notes" },
        { cle: "absences", label: "Absences" },
        { cle: "paiements", label: "Paiements" },
        { cle: "annonces", label: "Annonces" },
    ];

    return e("div", { className: "react-shell" },
        e("aside", { className: "react-sidebar" },
            e("div", { className: "react-sidebar-brand" }, e("span", { className: "crest" }, "M"), "Magnificat"),
            e("nav", null, liensNav.map(l => e("a", {
                key: l.cle,
                className: "react-nav-link" + (page === l.cle ? " actif" : ""),
                onClick: () => setPage(l.cle),
            }, l.label))),
            e("div", { className: "react-sidebar-bas" },
                e("div", { className: "react-user-pill" }, utilisateur),
                e("button", { className: "btn-mag-outline", style: { color: "var(--indigo-950)", borderColor: "var(--indigo-950)", width: "100%" }, onClick: onDeconnexion }, "Se deconnecter")
            )
        ),
        e("main", { className: "react-contenu", key: page },
            page === "dashboard" ? e(PageTableauDeBord, { token }) : e(PageRessource, { nom: page, token })
        )
    );
}

function App() {
    const [token, setToken] = useState(null);
    const [utilisateur, setUtilisateur] = useState(null);

    if (!token) {
        return e(ConnexionForm, { onConnecte: (tok, user) => { setToken(tok); setUtilisateur(user); } });
    }
    return e(AppConnectee, { token, utilisateur, onDeconnexion: () => { setToken(null); setUtilisateur(null); } });
}

ReactDOM.createRoot(document.getElementById("racine-react")).render(e(App));

</script>
</body>
</html>
